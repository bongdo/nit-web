<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nit-gui — background physics</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: transparent; font-family: ui-sans-serif, system-ui, sans-serif; }
  .stage {
    --scrim: oklch(0.985 0.002 250 / 0.92);
    position: relative; height: 460px; overflow: hidden;
    background: oklch(0.985 0.002 250); color: oklch(0.2 0.01 260);
    display: flex; align-items: center; justify-content: center;
  }
  .stage.dark {
    --scrim: oklch(0.165 0.008 260 / 0.9);
    background: oklch(0.165 0.008 260); color: oklch(0.93 0.004 250);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .copy { position: relative; text-align: center; max-width: 25rem; pointer-events: none; }
  .copy::before {
    content: ""; position: absolute; inset: -26px -54px; z-index: -1;
    background: radial-gradient(closest-side, var(--scrim), transparent);
  }
  .copy h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .copy p { margin: 8px 0 0; font-size: 14px; line-height: 22px; color: oklch(0.52 0.015 260); }
  .dark .copy p { color: oklch(0.66 0.012 255); }
  .tabs { position: absolute; top: 12px; left: 12px; right: 92px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button {
    font: 12px/1 ui-sans-serif, system-ui, sans-serif; padding: 8px 12px; border-radius: 8px;
    border: 1px solid oklch(0.9 0.006 250); background: oklch(1 0 0 / 0.82); color: inherit; cursor: pointer;
  }
  .tabs button.on { background: oklch(0.2 0.01 260); color: oklch(0.98 0 0); border-color: transparent; }
  .dark .tabs button { background: oklch(0.2 0.009 260 / 0.82); border-color: oklch(0.29 0.01 260); }
  .dark .tabs button.on { background: oklch(0.93 0.004 250); color: oklch(0.19 0.01 260); }
  .theme {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    font: 12px/1 ui-sans-serif, system-ui, sans-serif; padding: 8px 12px; border-radius: 8px;
    border: 1px solid oklch(0.9 0.006 250); background: oklch(1 0 0 / 0.82); color: inherit; cursor: pointer;
  }
  .dark .theme { background: oklch(0.2 0.009 260 / 0.82); border-color: oklch(0.29 0.01 260); }
  .hint {
    position: absolute; left: 14px; bottom: 12px; z-index: 2; font-size: 11.5px; line-height: 1.4;
    color: oklch(0.52 0.015 260); background: oklch(1 0 0 / 0.7); padding: 6px 9px; border-radius: 7px;
  }
  .dark .hint { color: oklch(0.66 0.012 255); background: oklch(0.17 0.008 260 / 0.7); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="tabs" id="tabs"></div>
  <button class="theme" id="theme">Dark</button>
  <div class="copy">
    <h2>Start a new chat</h2>
    <p>Type below and the chat is created in this directory on the first message.</p>
  </div>
  <div class="hint" id="hint"></div>
</div>
<script>
const stage = document.getElementById("stage");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const tabs = document.getElementById("tabs");
const hint = document.getElementById("hint");
const themeButton = document.getElementById("theme");
const media = matchMedia("(prefers-color-scheme: dark)");
let forced = null;
let mode = "ink";
let w = 0, h = 0, raf = 0, started = performance.now(), painted = 0;

const isDark = () => (forced ? forced === "dark" : media.matches);
const alpha = (hex, a) => `${hex}${Math.round(a * 255).toString(16).padStart(2, "0")}`;
const palettes = {
  ink: {
    dark: ["#2dd4bf", "#fb7185", "#fbbf24", "#a78bfa"],
    light: ["#0f766e", "#be123c", "#b45309", "#6d28d9"],
  },
  orbit: {
    dark: ["#8b5cf6", "#22d3ee", "#fbbf24", "#f472b6"],
    light: ["#6d28d9", "#0369a1", "#b45309", "#be185d"],
  },
  silk: {
    dark: ["#34d399", "#22d3ee", "#a78bfa", "#f472b6"],
    light: ["#0d9488", "#0284c7", "#7c3aed", "#db2777"],
  },
  pendulum: {
    dark: ["#fbbf24", "#fb7185", "#2dd4bf", "#a78bfa"],
    light: ["#b45309", "#be123c", "#0f766e", "#6d28d9"],
  },
  metaballs: {
    dark: ["#a3e635", "#e879f9", "#fb923c", "#22d3ee"],
    light: ["#0d9488", "#c026d3", "#ea580c", "#0284c7"],
  },
  fluid: {
    dark: ["#22d3ee", "#34d399", "#60a5fa", "#c084fc"],
    light: ["#0e7490", "#047857", "#1d4ed8", "#7e22ce"],
  },
  gravity: {
    dark: ["#a78bfa", "#38bdf8", "#fbbf24", "#f472b6"],
    light: ["#6d28d9", "#0369a1", "#b45309", "#be185d"],
  },
  glitch: {
    dark: ["#22d3ee", "#f0abfc", "#fbbf24", "#4ade80"],
    light: ["#0891b2", "#a21caf", "#b45309", "#15803d"],
  },
  nodes: {
    dark: ["#38bdf8", "#f472b6", "#a3e635", "#fbbf24"],
    light: ["#0369a1", "#be185d", "#4d7c0f", "#b45309"],
  },
};
const palette = () => palettes[mode][isDark() ? "dark" : "light"];

const pointer = { x: 0, y: 0, inside: false };
const cursor = { x: 0, y: 0 };

const ideas = {
  ink: { label: "Ink", hint: "цветные чернила текут по полю, курсор их размешивает", draw: drawInk, seed: seedInk },
  orbit: { label: "Orbit", hint: "частицы падают на курсор и закручиваются в орбиты", draw: drawOrbit, seed: seedOrbit },
  silk: { label: "Silk", hint: "полосы авроры прогибаются под курсором", draw: drawSilk, clear: true },
  pendulum: { label: "Pendulum", hint: "маятники вычерчивают кривые и тянутся к курсору", draw: drawPendulum, seed: seedPendulum },
  metaballs: { label: "Metaballs", hint: "цветные капли собираются вокруг курсора", draw: drawMetaballs, seed: seedMetaballs, clear: true },
  fluid: { label: "Fluid", hint: "цветные чернила плывут по течению, курсор закручивает поток", draw: drawFluid, seed: seedFluid, clear: true },
  gravity: { label: "Gravity", hint: "сетка прогибается вокруг тяжёлых масс и курсора", draw: drawGravity, clear: true },
  glitch: { label: "Glitch", hint: "полосы сигнала рвутся и дёргаются у курсора", draw: drawGlitch, clear: true },
  nodes: { label: "Nodes", hint: "сеть узлов тянется к курсору и подсвечивает связи", draw: drawNodes, seed: seedNodes, clear: true },
};

for (const [key, idea] of Object.entries(ideas)) {
  const button = document.createElement("button");
  button.textContent = idea.label;
  button.className = key === mode ? "on" : "";
  button.onclick = () => {
    mode = key;
    [...tabs.children].forEach((child) => (child.className = child.textContent === idea.label ? "on" : ""));
    hint.textContent = idea.hint;
    resetCanvas();
  };
  tabs.append(button);
}

const resetCanvas = () => {
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, w, h);
  ideas[mode].seed?.();
};

const setTheme = () => {
  stage.classList.toggle("dark", isDark());
  themeButton.textContent = isDark() ? "Light" : "Dark";
  resetCanvas();
};
themeButton.onclick = () => {
  forced = isDark() ? "light" : "dark";
  setTheme();
};
media.addEventListener("change", () => { if (!forced) setTheme(); });

const respawn = (p) => {
  p.x = Math.random() * w;
  p.y = Math.random() * h;
  p.px = p.x;
  p.py = p.y;
  p.life = 100 + Math.floor(Math.random() * 260);
  return p;
};

const inkParts = [];
const INK_COUNT = 360;
function seedInk() {
  inkParts.length = 0;
  const colors = palette();
  for (let i = 0; i < INK_COUNT; i += 1) {
    const p = respawn({ x: 0, y: 0, px: 0, py: 0, life: 0, color: "" });
    p.color = colors[i % colors.length];
    p.life = Math.floor(Math.random() * 280);
    inkParts.push(p);
  }
}
function drawInk(t) {
  const colors = palette();
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,0.11)";
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";
  const R = 210;
  ctx.lineWidth = 1;
  for (const p of inkParts) {
    const dx = p.x - cursor.x, dy = p.y - cursor.y;
    const d2 = dx * dx + dy * dy;
    const v = d2 < R * R ? Math.exp(-d2 / (R * R * 0.5)) : 0;
    const ax = 0.0038, ay = 0.006;
    const sx = Math.sin(p.x * ax + t * 0.18);
    let vx = -ay * sx * Math.sin(p.y * ay - t * 0.14);
    let vy = -ax * Math.cos(p.x * ax + t * 0.18) * Math.cos(p.y * ay - t * 0.14);
    let vl = Math.hypot(vx, vy) || 1;
    vx /= vl; vy /= vl;
    if (v > 0.01) {
      const d = Math.sqrt(d2) || 1;
      vx = vx * (1 - v * 0.7) + (-dy / d) * v * 1.5;
      vy = vy * (1 - v * 0.7) + (dx / d) * v * 1.5;
      vl = Math.hypot(vx, vy) || 1;
      vx /= vl; vy /= vl;
    }
    p.px = p.x; p.py = p.y;
    p.x += vx * (2 + v * 1.65);
    p.y += vy * (2 + v * 1.65);
    p.life -= 1;
    if (p.life <= 0 || p.x < -24 || p.x > w + 24 || p.y < -24 || p.y > h + 24) {
      p.color = colors[Math.floor(Math.random() * colors.length)];
      respawn(p);
      continue;
    }
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = 0.2 + v * 0.28;
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

const orbitParts = [];
const ORBIT_COUNT = 260;
const GRAVITY = 2400;
function seedOrbit() {
  orbitParts.length = 0;
  const colors = palette();
  for (let i = 0; i < ORBIT_COUNT; i += 1) {
    const angle = Math.random() * Math.PI * 2;
    const distance = 100 + Math.random() * 250;
    const speed = Math.sqrt(GRAVITY / (distance + 60)) * 0.9;
    const part = {
      x: cursor.x + Math.cos(angle) * distance,
      y: cursor.y + Math.sin(angle) * distance,
      px: 0, py: 0,
      vx: -Math.sin(angle) * speed,
      vy: Math.cos(angle) * speed,
      life: 400 + Math.floor(Math.random() * 600),
      color: colors[i % 3],
    };
    part.px = part.x;
    part.py = part.y;
    orbitParts.push(part);
  }
}
function drawOrbit() {
  const colors = palette();
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,0.035)";
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";
  const R = 230;
  ctx.lineWidth = 1;
  for (const p of orbitParts) {
    const dx = cursor.x - p.x, dy = cursor.y - p.y;
    const d2 = dx * dx + dy * dy;
    const d = Math.sqrt(d2) || 1;
    const v = d2 < R * R ? Math.exp(-d2 / (R * R * 0.8)) : 0;
    const force = GRAVITY / (d2 + 2200);
    p.vx += (dx / d) * force;
    p.vy += (dy / d) * force;
    p.vx *= 0.998; p.vy *= 0.998;
    const speed = Math.hypot(p.vx, p.vy);
    if (speed > 9) { p.vx *= 9 / speed; p.vy *= 9 / speed; }
    p.px = p.x; p.py = p.y;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 1;
    if (p.life <= 0 || d < 26 || p.x < -30 || p.x > w + 30 || p.y < -30 || p.y > h + 30) {
      const angle = Math.random() * Math.PI * 2;
      const distance = 180 + Math.random() * 220;
      const s = Math.sqrt(GRAVITY / (distance + 60)) * 0.9;
      p.x = cursor.x + Math.cos(angle) * distance;
      p.y = cursor.y + Math.sin(angle) * distance;
      p.px = p.x; p.py = p.y;
      p.vx = -Math.sin(angle) * s;
      p.vy = Math.cos(angle) * s;
      p.life = 400 + Math.floor(Math.random() * 600);
      p.color = colors[Math.floor(Math.random() * 3)];
      continue;
    }
    ctx.strokeStyle = v > 0.35 ? colors[2] : p.color;
    ctx.globalAlpha = 0.22 + v * 0.35;
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  const glow = ctx.createRadialGradient(cursor.x, cursor.y, 0, cursor.x, cursor.y, 100);
  glow.addColorStop(0, alpha(colors[2], isDark() ? 0.28 : 0.16));
  glow.addColorStop(1, alpha(colors[2], 0));
  ctx.fillStyle = glow;
  ctx.fillRect(cursor.x - 110, cursor.y - 110, 220, 220);
  ctx.globalAlpha = 1;
}

const silkLift = (x, base) => {
  const dx = x - cursor.x;
  const dy = base - cursor.y;
  const near = Math.exp(-(dx * dx) / (195 * 195)) * Math.exp(-(dy * dy) / (165 * 165));
  return Math.tanh((cursor.y - base) / 70) * near * 78;
};
function drawSilk(t) {
  const colors = palette();
  ctx.globalCompositeOperation = isDark() ? "lighter" : "source-over";
  const bands = 9;
  for (let i = 0; i < bands; i += 1) {
    const base = ((i + 0.5) / bands) * h;
    const amp = 24 + i * 5;
    const thick = 38 + (i % 3) * 22;
    const f = 0.0042 + i * 0.0005;
    const speed = 0.1 + i * 0.022;
    const phase = i * 1.7;
    const colorA = colors[i % colors.length];
    const colorB = colors[(i + 1) % colors.length];
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, alpha(colorA, isDark() ? 0.16 : 0.1));
    grad.addColorStop(0.5, alpha(colorB, isDark() ? 0.22 : 0.14));
    grad.addColorStop(1, alpha(colorA, 0));
    const top = [];
    const step = 12;
    for (let x = -20; x <= w + 20; x += step) {
      top.push([x, base + Math.sin(x * f + t * speed + phase) * amp + silkLift(x, base)]);
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    for (const [x, y] of top) {
      if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    for (let j = top.length - 1; j >= 0; j -= 1) {
      ctx.lineTo(top[j][0], top[j][1] + thick);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = alpha(colorB, isDark() ? 0.32 : 0.18);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const [x, y] of top) {
      if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  const glow = ctx.createRadialGradient(cursor.x, cursor.y, 0, cursor.x, cursor.y, 190);
  glow.addColorStop(0, alpha(colors[0], isDark() ? 0.14 : 0.08));
  glow.addColorStop(1, alpha(colors[0], 0));
  ctx.fillStyle = glow;
  ctx.fillRect(cursor.x - 200, cursor.y - 200, 400, 400);
  ctx.globalCompositeOperation = "source-over";
}

const pens = [];
const PEN_COUNT = 6;
function seedPendulum() {
  pens.length = 0;
  const colors = palette();
  for (let i = 0; i < PEN_COUNT; i += 1) {
    pens.push({ px: 0, py: 0, ready: false, color: colors[i % colors.length] });
  }
}
function drawPendulum(t) {
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,0.01)";
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";
  ctx.lineWidth = 1;
  for (let i = 0; i < pens.length; i += 1) {
    const pen = pens[i];
    const fx = 1.05 + i * 0.07;
    const fy = 1.4 - i * 0.05;
    const phase = i * 2.1;
    let x = w / 2 + Math.sin(t * fx + phase) * w * 0.34 + Math.sin(t * fy * 0.5 + phase) * w * 0.06;
    let y = h / 2 + Math.sin(t * fy + phase * 1.3) * h * 0.33;
    const dx = cursor.x - x;
    const dy = cursor.y - y;
    const pull = Math.exp(-(dx * dx + dy * dy) / (360 * 360)) * 0.6;
    x += dx * pull;
    y += dy * pull;
    if (pen.ready) {
      ctx.strokeStyle = pen.color;
      ctx.globalAlpha = 0.48;
      ctx.beginPath();
      ctx.moveTo(pen.px, pen.py);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
    pen.px = x; pen.py = y; pen.ready = true;
  }
  ctx.globalAlpha = 1;
}

const blobs = [];
const BLOB_COUNT = 8;
function seedMetaballs() {
  blobs.length = 0;
  for (let i = 0; i < BLOB_COUNT; i += 1) {
    const angle = (i / BLOB_COUNT) * Math.PI * 2;
    const distance = 80 + i * 12;
    blobs.push({
      x: cursor.x + Math.cos(angle) * distance,
      y: cursor.y + Math.sin(angle) * distance,
      vx: 0, vy: 0,
    });
  }
}
function drawMetaballs(t) {
  const colors = palette();
  ctx.globalCompositeOperation = isDark() ? "screen" : "multiply";
  for (let i = 0; i < blobs.length; i += 1) {
    const b = blobs[i];
    const angle = t * 0.22 + (i / BLOB_COUNT) * Math.PI * 2;
    const orbit = 70 + i * 13;
    const tx = cursor.x + Math.cos(angle) * orbit;
    const ty = cursor.y + Math.sin(angle * 1.35 + i) * orbit * 0.65;
    b.vx += (tx - b.x) * 0.004;
    b.vy += (ty - b.y) * 0.004;
    b.vx *= 0.95; b.vy *= 0.95;
    b.x += b.vx;
    b.y += b.vy;
    const radius = 105 + Math.sin(t * 0.5 + i) * 24;
    const color = colors[i % colors.length];
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, radius);
    g.addColorStop(0, alpha(color, isDark() ? 0.5 : 0.42));
    g.addColorStop(0.55, alpha(color, isDark() ? 0.18 : 0.14));
    g.addColorStop(1, alpha(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(b.x - radius, b.y - radius, radius * 2, radius * 2);
  }
  ctx.globalCompositeOperation = "source-over";
}

const FW = 160, FH = 90;
const fluid = { cur: null, next: null, canvas: null, octx: null, img: null };
const makeField = () => [new Float32Array(FW * FH), new Float32Array(FW * FH), new Float32Array(FW * FH)];
const toRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255);
const swirls = [
  { x: 0.28, y: 0.34, s: 32, r: 0.16, speed: 0.23 },
  { x: 0.72, y: 0.62, s: -28, r: 0.2, speed: 0.17 },
  { x: 0.5, y: 0.18, s: 20, r: 0.22, speed: 0.31 },
];
function seedFluid() {
  fluid.cur = fluid.cur || makeField();
  fluid.next = fluid.next || makeField();
  for (const channel of fluid.cur) channel.fill(0);
  const colors = palette();
  for (let n = 0; n < 18; n += 1) {
    const [cr, cg, cb] = toRgb(colors[n % colors.length]);
    const bx = Math.random() * FW, by = Math.random() * FH;
    const radius = 6 + Math.random() * 10;
    for (let y = Math.max(0, Math.floor(by - radius)); y <= Math.min(FH - 1, Math.ceil(by + radius)); y += 1) {
      for (let x = Math.max(0, Math.floor(bx - radius)); x <= Math.min(FW - 1, Math.ceil(bx + radius)); x += 1) {
        const d = Math.hypot(x - bx, y - by);
        if (d > radius) continue;
        const amount = (1 - d / radius) * 0.5;
        const i = y * FW + x;
        fluid.cur[0][i] = Math.min(1, fluid.cur[0][i] + cr * amount);
        fluid.cur[1][i] = Math.min(1, fluid.cur[1][i] + cg * amount);
        fluid.cur[2][i] = Math.min(1, fluid.cur[2][i] + cb * amount);
      }
    }
  }
  if (fluid.canvas) return;
  fluid.canvas = document.createElement("canvas");
  fluid.canvas.width = FW;
  fluid.canvas.height = FH;
  fluid.octx = fluid.canvas.getContext("2d");
  fluid.img = fluid.octx.createImageData(FW, FH);
}
const fluidAt = (channel, x, y) => {
  const cx = x < 0 ? 0 : x >= FW ? FW - 1 : x;
  const cy = y < 0 ? 0 : y >= FH ? FH - 1 : y;
  return channel[cy * FW + cx];
};
function drawFluid(t) {
  const colors = palette();
  const cur = fluid.cur, next = fluid.next;
  const [cr, cg, cb] = toRgb(colors[Math.floor(t / 1.6) % colors.length]);
  const px = (cursor.x / w) * FW;
  const py = (cursor.y / h) * FH;
  const knots = swirls.map((s, i) => ({
    x: (s.x + Math.sin(t * s.speed + i * 2.4) * s.r) * FW,
    y: (s.y + Math.cos(t * s.speed * 0.8 + i * 1.7) * s.r) * FH,
    s: s.s,
  }));
  knots.push({ x: px, y: py, s: 12 });
  for (let y = 0; y < FH; y += 1) {
    for (let x = 0; x < FW; x += 1) {
      let vx = 0.22, vy = 0.08;
      for (const k of knots) {
        const dx = x - k.x, dy = y - k.y;
        const f = k.s / (dx * dx + dy * dy + 34);
        vx -= dy * f;
        vy += dx * f;
      }
      vx += Math.sin(y * 0.8 + t * 0.7) * 0.3;
      vy += Math.cos(x * 0.7 - t * 0.6) * 0.3;
      const speed = Math.hypot(vx, vy) || 1;
      if (speed > 1.9) { vx *= 1.9 / speed; vy *= 1.9 / speed; }
      const sx = x - vx, sy = y - vy;
      const x0 = Math.floor(sx), y0 = Math.floor(sy);
      const fx = sx - x0, fy = sy - y0;
      const i = y * FW + x;
      for (let c = 0; c < 3; c += 1) {
        const ch = cur[c];
        next[c][i] = (
          (fluidAt(ch, x0, y0) * (1 - fx) + fluidAt(ch, x0 + 1, y0) * fx) * (1 - fy) +
          (fluidAt(ch, x0, y0 + 1) * (1 - fx) + fluidAt(ch, x0 + 1, y0 + 1) * fx) * fy
        ) * 0.996;
      }
    }
  }
  const drop = 6;
  for (let y = Math.floor(py - drop); y <= Math.ceil(py + drop); y += 1) {
    if (y < 0 || y >= FH) continue;
    for (let x = Math.floor(px - drop); x <= Math.ceil(px + drop); x += 1) {
      if (x < 0 || x >= FW) continue;
      const d = Math.hypot(x - px, y - py);
      if (d > drop) continue;
      const weight = (1 - d / drop) * 0.1;
      const i = y * FW + x;
      next[0][i] = Math.min(1, next[0][i] + cr * weight);
      next[1][i] = Math.min(1, next[1][i] + cg * weight);
      next[2][i] = Math.min(1, next[2][i] + cb * weight);
    }
  }
  fluid.cur = next;
  fluid.next = cur;
  const data = fluid.img.data;
  for (let i = 0; i < FW * FH; i += 1) {
    const r = fluid.cur[0][i], g = fluid.cur[1][i], b = fluid.cur[2][i];
    const peak = Math.max(r, g, b);
    const scale = peak > 1e-4 ? 255 / peak : 0;
    const o = i * 4;
    data[o] = r * scale;
    data[o + 1] = g * scale;
    data[o + 2] = b * scale;
    data[o + 3] = Math.min(0.42, peak * 1.1) * 255;
  }
  fluid.octx.putImageData(fluid.img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(fluid.canvas, 0, 0, w, h);
}

function drawGravity(t) {
  const colors = palette();
  const accent = colors[0];
  const wells = [
    { x: cursor.x, y: cursor.y, m: 4200 },
    { x: w * (0.5 + Math.sin(t * 0.19) * 0.3), y: h * (0.5 + Math.cos(t * 0.15) * 0.26), m: 2400 },
  ];
  const warp = (x, y) => {
    let dx = 0, dy = 0;
    for (const k of wells) {
      const ox = x - k.x, oy = y - k.y;
      const f = k.m / (ox * ox + oy * oy + 2600);
      dx += ox * f;
      dy += oy * f;
    }
    const len = Math.hypot(dx, dy);
    if (len > 46) { dx *= 46 / len; dy *= 46 / len; }
    return [x + dx, y + dy];
  };
  ctx.lineWidth = 1;
  ctx.strokeStyle = alpha(accent, isDark() ? 0.26 : 0.3);
  const gap = 27;
  for (let y = -gap; y <= h + gap; y += gap) {
    ctx.beginPath();
    for (let x = -gap; x <= w + gap; x += 7) {
      const [wx, wy] = warp(x, y);
      if (x === -gap) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    }
    ctx.stroke();
  }
  for (let x = -gap; x <= w + gap; x += gap) {
    ctx.beginPath();
    for (let y = -gap; y <= h + gap; y += 7) {
      const [wx, wy] = warp(x, y);
      if (y === -gap) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
    }
    ctx.stroke();
  }
  for (const k of wells) {
    const glow = ctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, 90);
    glow.addColorStop(0, alpha(accent, isDark() ? 0.16 : 0.1));
    glow.addColorStop(1, alpha(accent, 0));
    ctx.fillStyle = glow;
    ctx.fillRect(k.x - 90, k.y - 90, 180, 180);
  }
}

let glitchBase = null;
function drawGlitch(t) {
  if (!glitchBase) glitchBase = document.createElement("canvas");
  if (glitchBase.width !== Math.ceil(w) || glitchBase.height !== Math.ceil(h)) {
    glitchBase.width = Math.ceil(w);
    glitchBase.height = Math.ceil(h);
  }
  const base = glitchBase.getContext("2d");
  const colors = palette();
  base.clearRect(0, 0, w, h);
  for (let i = 0; i < 3; i += 1) {
    const gx = w * ((i + 0.5) / 3 + Math.sin(t * 0.3 + i * 2.1) * 0.08);
    const glow = base.createRadialGradient(gx, h * 0.5, 0, gx, h * 0.5, w * 0.28);
    glow.addColorStop(0, alpha(colors[i % colors.length], isDark() ? 0.1 : 0.14));
    glow.addColorStop(1, alpha(colors[i % colors.length], 0));
    base.fillStyle = glow;
    base.fillRect(gx - w * 0.28, 0, w * 0.56, h);
  }
  for (let i = 0; i < 54; i += 1) {
    const y = (i * 53.7 + Math.sin(i * 2.1) * 34 + h * 0.5) % h;
    const x = ((i * 197.3) % w) * 0.9;
    const len = 40 + ((i * 71) % 300);
    base.fillStyle = alpha(colors[i % colors.length], isDark() ? 0.28 : 0.42);
    base.fillRect(x, y, len, 1.2);
  }
  base.fillStyle = alpha(colors[Math.floor(t) % colors.length], isDark() ? 0.22 : 0.3);
  base.fillRect(0, (t * 46) % h, w, 2);
  const bands = 28;
  const bh = h / bands;
  for (let i = 0; i < bands; i += 1) {
    const y = i * bh;
    if (Math.random() < 0.04) continue;
    const near = Math.exp(-(((y + bh / 2 - cursor.y) / 150) ** 2));
    let dx = Math.sin(t * 1.1 + i * 0.7) * 1.5 + near * Math.sin(t * 7 + i * 1.9) * 18;
    if (Math.random() < 0.1) dx += (Math.random() - 0.5) * 90;
    ctx.drawImage(glitchBase, 0, y, w, bh, dx, y, w, bh);
    if (Math.random() < 0.05) {
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(glitchBase, 0, y, w, bh, dx + 5, y, w, bh);
      ctx.globalCompositeOperation = "source-over";
    }
  }
  ctx.globalAlpha = isDark() ? 0.03 : 0.06;
  ctx.fillStyle = isDark() ? "#ffffff" : "#000000";
  for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
  ctx.globalAlpha = 1;
  if (Math.random() < 0.12) {
    ctx.fillStyle = alpha(colors[1], 0.4);
    ctx.fillRect(0, Math.random() * h, w, 2);
  }
}

const nodes = [];
const NODE_COUNT = 68;
const NODE_LINK = 132;
function seedNodes() {
  nodes.length = 0;
  for (let i = 0; i < NODE_COUNT; i += 1) {
    nodes.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6,
    });
  }
}
function drawNodes() {
  const colors = palette();
  for (const n of nodes) {
    const dx = cursor.x - n.x, dy = cursor.y - n.y;
    const d = Math.hypot(dx, dy) || 1;
    n.vx += (Math.random() - 0.5) * 0.05;
    n.vy += (Math.random() - 0.5) * 0.05;
    if (d < 300) {
      n.vx += (dx / d) * 0.03 - (dy / d) * 0.02;
      n.vy += (dy / d) * 0.03 + (dx / d) * 0.02;
    }
    n.vx *= 0.986;
    n.vy *= 0.986;
    n.x += n.vx;
    n.y += n.vy;
    if (n.x < -20) n.x = w + 20;
    if (n.x > w + 20) n.x = -20;
    if (n.y < -20) n.y = h + 20;
    if (n.y > h + 20) n.y = -20;
  }
  const hot = nodes.map((n) => Math.hypot(n.x - cursor.x, n.y - cursor.y) < 170);
  ctx.lineWidth = 1;
  for (let i = 0; i < nodes.length; i += 1) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j += 1) {
      const b = nodes[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > NODE_LINK * NODE_LINK) continue;
      const strength = 1 - Math.sqrt(d2) / NODE_LINK;
      const linked = hot[i] || hot[j];
      ctx.strokeStyle = linked ? colors[1] : colors[0];
      ctx.globalAlpha = 0.06 + strength * (linked ? 0.5 : 0.22);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }
  ctx.fillStyle = colors[0];
  ctx.globalAlpha = 0.55;
  for (const n of nodes) ctx.fillRect(n.x - 1.4, n.y - 1.4, 2.8, 2.8);
  ctx.globalAlpha = 1;
}

const frame = (now) => {
  raf = requestAnimationFrame(frame);
  if (now - painted < 33) return;
  painted = now;
  const t = (now - started) / 1000;
  if (pointer.inside) {
    cursor.x += (pointer.x - cursor.x) * 0.16;
    cursor.y += (pointer.y - cursor.y) * 0.16;
  }
  if (ideas[mode].clear) ctx.clearRect(0, 0, w, h);
  ideas[mode].draw(t);
};

stage.addEventListener("pointermove", (event) => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = event.clientX - rect.left;
  pointer.y = event.clientY - rect.top;
  pointer.inside = true;
});
stage.addEventListener("pointerleave", () => { pointer.inside = false; });

const resize = () => {
  const rect = stage.getBoundingClientRect();
  w = rect.width; h = rect.height;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cursor.x = w * 0.63;
  cursor.y = h * 0.43;
  pointer.x = cursor.x;
  pointer.y = cursor.y;
  resetCanvas();
};

new ResizeObserver(resize).observe(stage);
setTheme();
resize();
hint.textContent = ideas[mode].hint;
started = performance.now();
raf = requestAnimationFrame(frame);
</script>
</body>
</html>
