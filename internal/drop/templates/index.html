<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>drop</title>
<link rel="stylesheet" href="static/drop.css">
</head>
<body>
<main class="page{{if not .Entries}} empty{{end}}">
  <div class="drop" data-dropzone tabindex="0" role="button" aria-label="Upload files">
    <input type="file" multiple hidden data-file-input>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </div>
  <p class="status" data-status role="status"></p>

  {{if .Entries}}
  <ul class="list">
    {{range .Entries}}
    <li class="item" data-entry="{{.Entry.ID}}">
      <a class="main" href="{{.URL}}" target="_blank" rel="noreferrer">
        <span class="kind" data-kind="{{.Entry.Kind}}" aria-hidden="true">
          {{if eq .Entry.Kind "site"}}
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/></svg>
          {{else if eq .Entry.Kind "collection"}}
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          {{else}}
          <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></svg>
          {{end}}
        </span>
        <span class="text">
          <span class="name">{{.Entry.Name}}</span>
          <span class="sub">{{.Size}}{{if gt .Files 1}} · {{.Files}}{{end}}{{if .Expires}} · {{.Expires}}{{end}}</span>
        </span>
      </a>
      <a class="slug" href="{{.URL}}" target="_blank" rel="noreferrer">{{.SlugPath}}</a>
      <div class="actions">
        {{if .HasDoc}}
        <a class="act" href="{{.DocURL}}" title="Open in pero" aria-label="Open in pero">
          <svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>
        </a>
        <a class="act" href="{{.RawDocURL}}" target="_blank" rel="noreferrer" title="Raw file" aria-label="Raw file">
          <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></svg>
        </a>
        {{end}}
        <button class="act" type="button" data-copy="{{.URL}}" title="Copy link" aria-label="Copy link">
          <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        </button>
        <button class="act public" type="button" data-public="{{if .Public}}1{{else}}0{{end}}" aria-pressed="{{.Public}}" title="{{if .Public}}Anonymous access on{{else}}Anonymous access off{{end}}" aria-label="Anonymous access">
          <svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <svg class="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg>
        </button>
        <details class="menu">
          <summary class="act" title="More" aria-label="More">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
          </summary>
          <div class="pop">
            <button type="button" data-edit-slug>Change link</button>
            <button type="button" data-expire="{{if .Forever}}1{{else}}0{{end}}">{{if .Forever}}Delete in 2 weeks{{else}}Keep forever{{end}}</button>
            <button type="button" class="danger" data-delete>Delete</button>
          </div>
        </details>
      </div>
      <form class="slug-form" hidden>
        <input name="slug" value="{{.Entry.Slug}}" autocomplete="off" spellcheck="false" aria-label="New link">
        <button type="submit">Save</button>
        <button type="button" data-cancel>Cancel</button>
      </form>
    </li>
    {{end}}
  </ul>
  {{end}}
</main>
<script src="static/drop.js" defer></script>
</body>
</html>
