<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>nit-gui</title>
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <script>
      (() => {
        const stored =
          (() => {
            try {
              return localStorage.getItem("nit-gui.theme");
            } catch {
              return null;
            }
          })() || "system";
        const dark =
          stored === "dark" ||
          ["nord", "gruvbox", "dracula", "ember", "paper-dark", "kiln", "ash-dark"].includes(stored) ||
          (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme =
          stored === "system" ? (dark ? "dark" : "light") : stored;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
