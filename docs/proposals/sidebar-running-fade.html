<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sidebar: угасание чатов к running</title>
    <style>
      :root {
        --bg: #0b0b0b;
        --line: #262626;
        --fg: #ededed;
        --muted: #9a9a9a;
        --green: #3fd68c;
        --row: 44px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px;
        background: #050505;
        color: var(--fg);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        justify-content: center;
        align-items: flex-start;
      }
      .demo { width: 288px; }
      .demo h2 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
      .demo h2 span { color: #777; font-weight: 400; }
      .demo p { margin: 0 0 10px; color: #777; font-size: 12px; }
      .sidebar {
        height: 560px;
        border-radius: 12px;
        background: var(--bg);
        border: 1px solid #1a1a1a;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px; }
      .list > div { display: flex; flex-direction: column; }
      .chat { display: flex; align-items: center; gap: 10px; height: var(--row); padding: 0 10px; flex: none; }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #4a4a4a; flex: none; }
      .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e2e2e2; }
      .time { font-size: 12px; color: var(--muted); }
      .load { color: #8a8a8a; text-align: center; padding: 8px; font-size: 12px; }
      .running-head {
        display: flex; align-items: center; gap: 8px; padding: 14px 14px 6px;
        font: 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
      }
      .running-head .dot { background: var(--green); }
      .running-head .line { height: 1px; flex: 1; background: var(--line); }
      .run .name { color: #f5f5f5; }
      .run .state { color: var(--green); font-size: 12px; }
      .icons { display: flex; gap: 20px; padding: 10px 16px; border-top: 1px solid var(--line); color: #9a9a9a; }
      .icons .count { margin-left: auto; font-size: 12px; }

      .current .running-block { background: #151515; }

      .fade .list {
        padding-bottom: 64px;
        -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent);
        mask-image: linear-gradient(to bottom, #000 calc(100% - 64px), transparent);
      }
    </style>
  </head>
  <body>
    <div class="demo current">
      <h2>Сейчас <span>— панель и обрез</span></h2>
      <p>У running свой фон, обычные чаты режутся под ним.</p>
      <div class="sidebar">
        <div class="list"></div>
        <div class="running-block">
          <div class="running-head"><span class="dot"></span><span>Running</span><span>1</span><span class="line"></span></div>
          <div class="chat run"><span class="dot"></span><span class="name">Инструменты разр...</span><span class="state">running</span></div>
        </div>
        <div class="icons"><span>◔</span><span>☾</span><span>♪</span><span>⚙</span><span class="count">◉ 97</span></div>
      </div>
    </div>

    <div class="demo fade">
      <h2>Как надо <span>— тот же фон, чаты гаснут</span></h2>
      <p>Фона у running нет. Чаты растворяются за 64px до него.</p>
      <div class="sidebar">
        <div class="list"></div>
        <div class="running-block">
          <div class="running-head"><span class="dot"></span><span>Running</span><span>1</span><span class="line"></span></div>
          <div class="chat run"><span class="dot"></span><span class="name">Инструменты разр...</span><span class="state">running</span></div>
        </div>
        <div class="icons"><span>◔</span><span>☾</span><span>♪</span><span>⚙</span><span class="count">◉ 97</span></div>
      </div>
    </div>

    <script>
      const chats = [
        ["Анимированный интер...", "2d"],
        ["Убрать резкое белое п...", "2d"],
        ["Сохранение позиции в...", "2d"],
        ["Новые темы и меню /th...", "2d"],
        ["Переключение чатов т...", "3d"],
        ["Быстрые переходы из...", "3d"],
        ["Мобильный чат-ассис...", "4d"],
        ["Исследования, UML и с...", "4d"],
        ["Vision: archive pass", "5d"],
        ["Улучшение выбора раб...", "5d"],
        ["Мобильная клавиатура...", "6d"],
        ["Ответы с картинками", "6d"],
        ["Отмена и повтор запроса", "6d"],
        ["Тёмная тема для таблиц", "7d"],
        ["Прокрутка длинных ответ...", "7d"],
        ["Копирование кода в один клик", "8d"],
      ];
      for (const list of document.querySelectorAll(".list")) {
        const wrap = document.createElement("div");
        for (const [name, time] of chats) {
          const chat = document.createElement("div");
          chat.className = "chat";
          chat.innerHTML = '<span class="dot"></span><span class="name"></span><span class="time"></span>';
          chat.querySelector(".name").textContent = name;
          chat.querySelector(".time").textContent = time;
          wrap.append(chat);
        }
        const load = document.createElement("div");
        load.className = "load";
        load.textContent = "Load older chats";
        wrap.append(load);
        list.append(wrap);
      }
      for (const list of document.querySelectorAll(".list")) list.scrollTop = 70;
    </script>
  </body>
</html>
