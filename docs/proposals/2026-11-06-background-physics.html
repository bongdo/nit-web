<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nit-gui — background physics</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; background: transparent; font-family: ui-sans-serif, system-ui, sans-serif; }
  .stage {
    --scrim: oklch(0.985 0.002 250 / 0.92);
    position: relative; height: 460px; overflow: hidden;
    background: oklch(0.985 0.002 250); color: oklch(0.2 0.01 260);
    display: flex; align-items: center; justify-content: center;
  }
  .stage.dark {
    --scrim: oklch(0.165 0.008 260 / 0.9);
    background: oklch(0.165 0.008 260); color: oklch(0.93 0.004 250);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .copy { position: relative; text-align: center; max-width: 25rem; pointer-events: none; }
  .copy::before {
    content: ""; position: absolute; inset: -26px -54px; z-index: -1;
    background: radial-gradient(closest-side, var(--scrim), transparent);
  }
  .copy h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .copy p { margin: 8px 0 0; font-size: 14px; line-height: 22px; color: oklch(0.52 0.015 260); }
  .dark .copy p { color: oklch(0.66 0.012 255); }
  .tabs { position: absolute; top: 12px; left: 12px; right: 92px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button {
    font: 12px/1 ui-sans-serif, system-ui, sans-serif; padding: 8px 12px; border-radius: 8px;
    border: 1px solid oklch(0.9 0.006 250); background: oklch(1 0 0 / 0.82); color: inherit; cursor: pointer;
  }
  .tabs button.on { background: oklch(0.2 0.01 260); color: oklch(0.98 0 0); border-color: transparent; }
  .dark .tabs button { background: oklch(0.2 0.009 260 / 0.82); border-color: oklch(0.29 0.01 260); }
  .dark .tabs button.on { background: oklch(0.93 0.004 250); color: oklch(0.19 0.01 260); }
  .theme {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    font: 12px/1 ui-sans-serif, system-ui, sans-serif; padding: 8px 12px; border-radius: 8px;
    border: 1px solid oklch(0.9 0.006 250); background: oklch(1 0 0 / 0.82); color: inherit; cursor: pointer;
  }
  .dark .theme { background: oklch(0.2 0.009 260 / 0.82); border-color: oklch(0.29 0.01 260); }
  .hint {
    position: absolute; left: 14px; bottom: 12px; z-index: 2; font-size: 11.5px; line-height: 1.4;
    color: oklch(0.52 0.015 260); background: oklch(1 0 0 / 0.7); padding: 6px 9px; border-radius: 7px;
  }
  .dark .hint { color: oklch(0.66 0.012 255); background: oklch(0.17 0.008 260 / 0.7); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="tabs" id="tabs"></div>
  <button class="theme" id="theme">Dark</button>
  <div class="copy">
    <h2>Start a new chat</h2>
    <p>Type below and the chat is created in this directory on the first message.</p>
  </div>
  <div class="hint" id="hint"></div>
</div>
<script>
const stage = document.getElementById("stage");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const tabs = document.getElementById("tabs");
const hint = document.getElementById("hint");
const themeButton = document.getElementById("theme");
const media = matchMedia("(prefers-color-scheme: dark)");
let forced = null;
let mode = "ink";
let w = 0, h = 0, raf = 0, started = performance.now(), painted = 0;

const isDark = () => (forced ? forced === "dark" : media.matches);
const alpha = (hex, a) => `${hex}${Math.round(a * 255).toString(16).padStart(2, "0")}`;
const palettes = {
  ink: {
    dark: ["#2dd4bf", "#fb7185", "#fbbf24", "#a78bfa"],
    light: ["#0f766e", "#be123c", "#b45309", "#6d28d9"],
  },
  orbit: {
    dark: ["#8b5cf6", "#22d3ee", "#fbbf24", "#f472b6"],
    light: ["#6d28d9", "#0369a1", "#b45309", "#be185d"],
  },
  silk: {
    dark: ["#34d399", "#22d3ee", "#a78bfa", "#f472b6"],
    light: ["#0d9488", "#0284c7", "#7c3aed", "#db2777"],
  },
  pendulum: {
    dark: ["#fbbf24", "#fb7185", "#2dd4bf", "#a78bfa"],
    light: ["#b45309", "#be123c", "#0f766e", "#6d28d9"],
  },
  metaballs: {
    dark: ["#a3e635", "#e879f9", "#fb923c", "#22d3ee"],
    light: ["#0d9488", "#c026d3", "#ea580c", "#0284c7"],
  },
};
const palette = () => palettes[mode][isDark() ? "dark" : "light"];

const pointer = { x: 0, y: 0, inside: false };
const cursor = { x: 0, y: 0 };

const ideas = {
  ink: { label: "Ink", hint: "цветные чернила текут по полю, курсор их размешивает", draw: drawInk, seed: seedInk },
  orbit: { label: "Orbit", hint: "частицы падают на курсор и закручиваются в орбиты", draw: drawOrbit, seed: seedOrbit },
  silk: { label: "Silk", hint: "полосы авроры прогибаются под курсором", draw: drawSilk },
  pendulum: { label: "Pendulum", hint: "маятники вычерчивают кривые и тянутся к курсору", draw: drawPendulum, seed: seedPendulum },
  metaballs: { label: "Metaballs", hint: "цветные капли собираются вокруг курсора", draw: drawMetaballs, seed: seedMetaballs },
};

for (const [key, idea] of Object.entries(ideas)) {
  const button = document.createElement("button");
  button.textContent = idea.label;
  button.className = key === mode ? "on" : "";
  button.onclick = () => {
    mode = key;
    [...tabs.children].forEach((child) => (child.className = child.textContent === idea.label ? "on" : ""));
    hint.textContent = idea.hint;
    resetCanvas();
  };
  tabs.append(button);
}

const resetCanvas = () => {
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, w, h);
  ideas[mode].seed?.();
};

const setTheme = () => {
  stage.classList.toggle("dark", isDark());
  themeButton.textContent = isDark() ? "Light" : "Dark";
  resetCanvas();
};
themeButton.onclick = () => {
  forced = isDark() ? "light" : "dark";
  setTheme();
};
media.addEventListener("change", () => { if (!forced) setTheme(); });

const respawn = (p) => {
  p.x = Math.random() * w;
  p.y = Math.random() * h;
  p.px = p.x;
  p.py = p.y;
  p.life = 100 + Math.floor(Math.random() * 260);
  return p;
};

const inkParts = [];
const INK_COUNT = 460;
function seedInk() {
  inkParts.length = 0;
  const colors = palette();
  for (let i = 0; i < INK_COUNT; i += 1) {
    const p = respawn({ x: 0, y: 0, px: 0, py: 0, life: 0, color: "" });
    p.color = colors[i % colors.length];
    p.life = Math.floor(Math.random() * 280);
    inkParts.push(p);
  }
}
function drawInk(t) {
  const colors = palette();
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,0.045)";
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";
  const R = 210;
  ctx.lineWidth = 1;
  for (const p of inkParts) {
    const dx = p.x - cursor.x, dy = p.y - cursor.y;
    const d2 = dx * dx + dy * dy;
    const v = d2 < R * R ? Math.exp(-d2 / (R * R * 0.5)) : 0;
    const ax = 0.0038, ay = 0.006;
    const sx = Math.sin(p.x * ax + t * 0.18);
    let vx = -ay * sx * Math.sin(p.y * ay - t * 0.14);
    let vy = -ax * Math.cos(p.x * ax + t * 0.18) * Math.cos(p.y * ay - t * 0.14);
    let vl = Math.hypot(vx, vy) || 1;
    vx /= vl; vy /= vl;
    if (v > 0.01) {
      const d = Math.sqrt(d2) || 1;
      vx = vx * (1 - v * 0.7) + (-dy / d) * v * 1.5;
      vy = vy * (1 - v * 0.7) + (dx / d) * v * 1.5;
      vl = Math.hypot(vx, vy) || 1;
      vx /= vl; vy /= vl;
    }
    p.px = p.x; p.py = p.y;
    p.x += vx * (1.1 + v * 0.9);
    p.y += vy * (1.1 + v * 0.9);
    p.life -= 1;
    if (p.life <= 0 || p.x < -24 || p.x > w + 24 || p.y < -24 || p.y > h + 24) {
      p.color = colors[Math.floor(Math.random() * colors.length)];
      respawn(p);
      continue;
    }
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = 0.2 + v * 0.28;
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

const orbitParts = [];
const ORBIT_COUNT = 260;
const GRAVITY = 2400;
function seedOrbit() {
  orbitParts.length = 0;
  const colors = palette();
  for (let i = 0; i < ORBIT_COUNT; i += 1) {
    const angle = Math.random() * Math.PI * 2;
    const distance = 100 + Math.random() * 250;
    const speed = Math.sqrt(GRAVITY / (distance + 60)) * 0.9;
    const part = {
      x: cursor.x + Math.cos(angle) * distance,
      y: cursor.y + Math.sin(angle) * distance,
      px: 0, py: 0,
      vx: -Math.sin(angle) * speed,
      vy: Math.cos(angle) * speed,
      life: 400 + Math.floor(Math.random() * 600),
      color: colors[i % 3],
    };
    part.px = part.x;
    part.py = part.y;
    orbitParts.push(part);
  }
}
function drawOrbit() {
  const colors = palette();
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,0.035)";
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";
  const R = 230;
  ctx.lineWidth = 1;
  for (const p of orbitParts) {
    const dx = cursor.x - p.x, dy = cursor.y - p.y;
    const d2 = dx * dx + dy * dy;
    const d = Math.sqrt(d2) || 1;
    const v = d2 < R * R ? Math.exp(-d2 / (R * R * 0.8)) : 0;
    const force = GRAVITY / (d2 + 2200);
    p.vx += (dx / d) * force;
    p.vy += (dy / d) * force;
    p.vx *= 0.998; p.vy *= 0.998;
    const speed = Math.hypot(p.vx, p.vy);
    if (speed > 9) { p.vx *= 9 / speed; p.vy *= 9 / speed; }
    p.px = p.x; p.py = p.y;
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 1;
    if (p.life <= 0 || d < 26 || p.x < -30 || p.x > w + 30 || p.y < -30 || p.y > h + 30) {
      const angle = Math.random() * Math.PI * 2;
      const distance = 180 + Math.random() * 220;
      const s = Math.sqrt(GRAVITY / (distance + 60)) * 0.9;
      p.x = cursor.x + Math.cos(angle) * distance;
      p.y = cursor.y + Math.sin(angle) * distance;
      p.px = p.x; p.py = p.y;
      p.vx = -Math.sin(angle) * s;
      p.vy = Math.cos(angle) * s;
      p.life = 400 + Math.floor(Math.random() * 600);
      p.color = colors[Math.floor(Math.random() * 3)];
      continue;
    }
    ctx.strokeStyle = v > 0.35 ? colors[2] : p.color;
    ctx.globalAlpha = 0.22 + v * 0.35;
    ctx.beginPath();
    ctx.moveTo(p.px, p.py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  const glow = ctx.createRadialGradient(cursor.x, cursor.y, 0, cursor.x, cursor.y, 100);
  glow.addColorStop(0, alpha(colors[2], isDark() ? 0.28 : 0.16));
  glow.addColorStop(1, alpha(colors[2], 0));
  ctx.fillStyle = glow;
  ctx.fillRect(cursor.x - 110, cursor.y - 110, 220, 220);
  ctx.globalAlpha = 1;
}

const silkLift = (x, base) => {
  const dx = x - cursor.x;
  const dy = base - cursor.y;
  const near = Math.exp(-(dx * dx) / (195 * 195)) * Math.exp(-(dy * dy) / (165 * 165));
  return Math.tanh((cursor.y - base) / 70) * near * 78;
};
function drawSilk(t) {
  const colors = palette();
  ctx.globalCompositeOperation = isDark() ? "lighter" : "source-over";
  const bands = 9;
  for (let i = 0; i < bands; i += 1) {
    const base = ((i + 0.5) / bands) * h;
    const amp = 24 + i * 5;
    const thick = 38 + (i % 3) * 22;
    const f = 0.0042 + i * 0.0005;
    const speed = 0.1 + i * 0.022;
    const phase = i * 1.7;
    const colorA = colors[i % colors.length];
    const colorB = colors[(i + 1) % colors.length];
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, alpha(colorA, isDark() ? 0.16 : 0.1));
    grad.addColorStop(0.5, alpha(colorB, isDark() ? 0.22 : 0.14));
    grad.addColorStop(1, alpha(colorA, 0));
    const top = [];
    const step = 12;
    for (let x = -20; x <= w + 20; x += step) {
      top.push([x, base + Math.sin(x * f + t * speed + phase) * amp + silkLift(x, base)]);
    }
    ctx.fillStyle = grad;
    ctx.beginPath();
    for (const [x, y] of top) {
      if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    for (let j = top.length - 1; j >= 0; j -= 1) {
      ctx.lineTo(top[j][0], top[j][1] + thick);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = alpha(colorB, isDark() ? 0.32 : 0.18);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const [x, y] of top) {
      if (x === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  const glow = ctx.createRadialGradient(cursor.x, cursor.y, 0, cursor.x, cursor.y, 190);
  glow.addColorStop(0, alpha(colors[0], isDark() ? 0.14 : 0.08));
  glow.addColorStop(1, alpha(colors[0], 0));
  ctx.fillStyle = glow;
  ctx.fillRect(cursor.x - 200, cursor.y - 200, 400, 400);
  ctx.globalCompositeOperation = "source-over";
}

const pens = [];
const PEN_COUNT = 6;
function seedPendulum() {
  pens.length = 0;
  const colors = palette();
  for (let i = 0; i < PEN_COUNT; i += 1) {
    pens.push({ px: 0, py: 0, ready: false, color: colors[i % colors.length] });
  }
}
function drawPendulum(t) {
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = "rgba(0,0,0,0.01)";
  ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";
  ctx.lineWidth = 1;
  for (let i = 0; i < pens.length; i += 1) {
    const pen = pens[i];
    const fx = 1.05 + i * 0.07;
    const fy = 1.4 - i * 0.05;
    const phase = i * 2.1;
    let x = w / 2 + Math.sin(t * fx + phase) * w * 0.34 + Math.sin(t * fy * 0.5 + phase) * w * 0.06;
    let y = h / 2 + Math.sin(t * fy + phase * 1.3) * h * 0.33;
    const dx = cursor.x - x;
    const dy = cursor.y - y;
    const pull = Math.exp(-(dx * dx + dy * dy) / (360 * 360)) * 0.6;
    x += dx * pull;
    y += dy * pull;
    if (pen.ready) {
      ctx.strokeStyle = pen.color;
      ctx.globalAlpha = 0.48;
      ctx.beginPath();
      ctx.moveTo(pen.px, pen.py);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
    pen.px = x; pen.py = y; pen.ready = true;
  }
  ctx.globalAlpha = 1;
}

const blobs = [];
const BLOB_COUNT = 8;
function seedMetaballs() {
  blobs.length = 0;
  for (let i = 0; i < BLOB_COUNT; i += 1) {
    const angle = (i / BLOB_COUNT) * Math.PI * 2;
    const distance = 80 + i * 12;
    blobs.push({
      x: cursor.x + Math.cos(angle) * distance,
      y: cursor.y + Math.sin(angle) * distance,
      vx: 0, vy: 0,
    });
  }
}
function drawMetaballs(t) {
  const colors = palette();
  ctx.globalCompositeOperation = isDark() ? "screen" : "multiply";
  for (let i = 0; i < blobs.length; i += 1) {
    const b = blobs[i];
    const angle = t * 0.22 + (i / BLOB_COUNT) * Math.PI * 2;
    const orbit = 70 + i * 13;
    const tx = cursor.x + Math.cos(angle) * orbit;
    const ty = cursor.y + Math.sin(angle * 1.35 + i) * orbit * 0.65;
    b.vx += (tx - b.x) * 0.004;
    b.vy += (ty - b.y) * 0.004;
    b.vx *= 0.95; b.vy *= 0.95;
    b.x += b.vx;
    b.y += b.vy;
    const radius = 105 + Math.sin(t * 0.5 + i) * 24;
    const color = colors[i % colors.length];
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, radius);
    g.addColorStop(0, alpha(color, isDark() ? 0.5 : 0.42));
    g.addColorStop(0.55, alpha(color, isDark() ? 0.18 : 0.14));
    g.addColorStop(1, alpha(color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(b.x - radius, b.y - radius, radius * 2, radius * 2);
  }
  ctx.globalCompositeOperation = "source-over";
}

const frame = (now) => {
  raf = requestAnimationFrame(frame);
  if (now - painted < 33) return;
  painted = now;
  const t = (now - started) / 1000;
  if (pointer.inside) {
    cursor.x += (pointer.x - cursor.x) * 0.16;
    cursor.y += (pointer.y - cursor.y) * 0.16;
  }
  if (mode === "silk" || mode === "metaballs") ctx.clearRect(0, 0, w, h);
  ideas[mode].draw(t);
};

stage.addEventListener("pointermove", (event) => {
  const rect = canvas.getBoundingClientRect();
  pointer.x = event.clientX - rect.left;
  pointer.y = event.clientY - rect.top;
  pointer.inside = true;
});
stage.addEventListener("pointerleave", () => { pointer.inside = false; });

const resize = () => {
  const rect = stage.getBoundingClientRect();
  w = rect.width; h = rect.height;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cursor.x = w * 0.63;
  cursor.y = h * 0.43;
  pointer.x = cursor.x;
  pointer.y = cursor.y;
  resetCanvas();
};

new ResizeObserver(resize).observe(stage);
setTheme();
resize();
hint.textContent = ideas[mode].hint;
started = performance.now();
raf = requestAnimationFrame(frame);
</script>
</body>
</html>
