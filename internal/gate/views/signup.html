{{define "signup"}}{{template "head" .}}
<div class="panel">
  <h1>запрос доступа</h1>
  <form class="stack" method="post" action="/signup">
    <label>имя<input name="name" value="{{.Name}}" autocomplete="username" autofocus></label>
    <button class="primary">отправить заявку</button>
  </form>
  <p class="hint">пароль задаёшь не сейчас: после одобрения придёт ссылка-приглашение.</p>
</div>
{{template "foot" .}}{{end}}
