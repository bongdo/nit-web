<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>{{.Title}}</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--muted:#777;--line:#e5e5e5;--hover:#f5f5f5}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--muted:#999;--line:#2a2a2a;--hover:#1b1b1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:24px 16px}
a{color:inherit;text-decoration:none}
.row{display:flex;justify-content:space-between;gap:16px;padding:10px 8px;border-bottom:1px solid var(--line)}
.row:hover{background:var(--hover)}
.row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span:last-child{color:var(--muted);flex-shrink:0}
</style>
</head>
<body>
<main>
{{if .HasParent}}<a class="row" href="{{.Parent}}"><span>..</span><span></span></a>{{end}}
{{range .Files}}<a class="row" href="{{.URL}}"><span>{{.Path}}</span><span>{{.Size}}</span></a>{{end}}
</main>
</body>
</html>
